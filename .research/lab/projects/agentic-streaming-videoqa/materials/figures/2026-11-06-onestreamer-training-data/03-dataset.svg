<text x="1230" y="690" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="17" fill="#6b7280" font-weight="normal" text-anchor="start" opacity="1">§4.2 の最後の形と同じ。明記した文はない</text>
<text x="1230" y="895" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="17" fill="#6b7280" font-weight="normal" text-anchor="start" opacity="1">[AI] 下の可能性はある</text>
<text x="50" y="1020" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="20" fill="#262a33" font-weight="normal" text-anchor="start" opacity="1">・学習の手順は 4 族とも同じ（同じ SFT・同じ損失）。違うのは系列の中身と PSTL のアンカーだけ</text>
<text x="50" y="1054" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="20" fill="#262a33" font-weight="normal" text-anchor="start" opacity="1">・これとは別に LLaVA-Video のオフライン動画データも混ぜる（§5）。実際に読み込んだのは 991,773 件、詰めた後の系列は 150,261 本（表7）</text>
<text x="50" y="1088" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="20" fill="#262a33" font-weight="normal" text-anchor="start" opacity="1">・既存データの分は図5 の手順を通らず、公開データを共通の形式に直したもの（直し方は書かれていない）</text>
<text x="50" y="1130" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="18" fill="#6b7280" font-weight="normal" text-anchor="start" opacity="1">※ Core の件数は表6 から AI が族ごとに足した値。公開版（Hugging Face）では Perception &amp; Memory QA は制御トークンを使わず、質問の時刻に答えるだけの形（2026-11-06 に 1 件で確認）</text>

<text x="70" y="170" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="19" fill="#262a33" font-weight="normal" text-anchor="start" opacity="1">全データ（4 つの族 + LLaVA-Video）を混ぜて学習。映像のエンコーダ（ViT）は固定し、projector と LLM を動かす。強化学習はない（§5、表7）</text>

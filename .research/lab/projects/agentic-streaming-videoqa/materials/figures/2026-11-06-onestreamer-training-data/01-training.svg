<text x="1567" y="579" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="18" fill="#2f8f63" font-weight="bold" text-anchor="middle" opacity="1">文は全トークン</text>
<text x="330" y="593" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="18" fill="#262a33" font-weight="normal" text-anchor="start" opacity="1">状態の損失：PSTL で選んだ位置だけ（ここでは Silence→Silence の組 3 個から 1 個を選ぶ。次の図）。最初の 1 個の扱いは書かれていない</text>
<text x="330" y="621" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="18" fill="#262a33" font-weight="normal" text-anchor="start" opacity="1">文の損失：Response の後の答えの文は全部。Observe・Summary の後の記録の文も同じ</text>
<path d="M200,313 L200,303 L1086,303 L1086,313" fill="none" stroke="#c9800e" stroke-width="3"/>
<text x="200" y="291" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="19" fill="#c9800e" font-weight="bold" text-anchor="start" opacity="1">5 秒目の Standby を予測するときに見えるのは、ここまで（質問・1〜5 秒の映像・正解の Silence 4 個）</text>
<rect x="40" y="680" width="1720" height="300" rx="18" fill="#f4f6fd" stroke="#4a5fc1" stroke-width="3" opacity="1"/>
<text x="70" y="728" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="26" fill="#4a5fc1" font-weight="bold" text-anchor="start" opacity="1">やり方（teacher forcing、付録 A.1）</text>
<text x="80" y="778" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="22" fill="#4a5fc1" font-weight="bold" text-anchor="start" opacity="1">①</text>
<text x="120" y="778" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="21" fill="#262a33" font-weight="normal" text-anchor="start" opacity="1">モデルは何も生成しない。正解の系列を 1 回で全部読む</text>
<text x="80" y="826" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="22" fill="#4a5fc1" font-weight="bold" text-anchor="start" opacity="1">②</text>
<text x="120" y="826" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="21" fill="#262a33" font-weight="normal" text-anchor="start" opacity="1">各位置で「それより前だけ」を見て、次のトークンの確率を出す（予測）。後ろは隠す（因果的なマスク）</text>
<text x="80" y="874" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="22" fill="#4a5fc1" font-weight="bold" text-anchor="start" opacity="1">③</text>
<text x="120" y="874" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="21" fill="#262a33" font-weight="normal" text-anchor="start" opacity="1">次の入力には、モデルの予測ではなく正解が入る（2 秒目に Standby を出しそうでも、3 秒目の入力は正解の Silence）</text>
<text x="80" y="922" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="22" fill="#4a5fc1" font-weight="bold" text-anchor="start" opacity="1">④</text>
<text x="120" y="922" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="21" fill="#262a33" font-weight="normal" text-anchor="start" opacity="1">正解のトークンの確率が低いほど損失が大きい。選んだ位置の損失をまとめて 1 回更新する</text>
<text x="80" y="962" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="19" fill="#6b7280" font-weight="normal" text-anchor="start" opacity="1">推論では損失を計算しない。予測から 1 つ選んで出し（生成）、それを次の入力にする、を繰り返すだけ。答えた結果から学ぶ強化学習はしていない</text>
<text x="50" y="1020" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="24" fill="#262a33" font-weight="bold" text-anchor="start" opacity="1">損失は 2 種類（§3.3、付録 A.1）</text>
<rect x="50" y="1038" width="1700" height="44" rx="6" fill="#262a33" stroke="#262a33" stroke-width="1" opacity="1"/>
<text x="64" y="1068" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="20" fill="#ffffff" font-weight="bold" text-anchor="start" opacity="1">損失</text>
<text x="264" y="1068" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="20" fill="#ffffff" font-weight="bold" text-anchor="start" opacity="1">どこに付くか</text>
<text x="1404" y="1068" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="20" fill="#ffffff" font-weight="bold" text-anchor="start" opacity="1">間引くか</text>
<rect x="50" y="1082" width="1700" height="44" rx="0" fill="#f5f6f8" stroke="#d1d5db" stroke-width="1" opacity="1"/>
<text x="64" y="1112" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="20" fill="#262a33" font-weight="bold" text-anchor="start" opacity="1">文の損失</text>
<text x="264" y="1112" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="19" fill="#262a33" font-weight="normal" text-anchor="start" opacity="1">Observe・Summary の後の記録の文、Response の後の答えの文の全トークン</text>
<text x="1404" y="1112" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="19" fill="#262a33" font-weight="bold" text-anchor="start" opacity="1">間引かない</text>
<rect x="50" y="1126" width="1700" height="44" rx="0" fill="#ffffff" stroke="#d1d5db" stroke-width="1" opacity="1"/>
<text x="64" y="1156" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="20" fill="#262a33" font-weight="bold" text-anchor="start" opacity="1">状態の損失</text>
<text x="264" y="1156" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="19" fill="#262a33" font-weight="normal" text-anchor="start" opacity="1">制御トークン（Silence・Standby・Observe・Summary・Response）の位置</text>
<text x="1404" y="1156" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="19" fill="#262a33" font-weight="bold" text-anchor="start" opacity="1">PSTL で選んだ位置だけ</text>
<text x="50" y="1205" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="19" fill="#6b7280" font-weight="normal" text-anchor="start" opacity="1">※ 書かれていないこと：2 つの損失の足し合わせ方（重み）、入力側（映像・質問）に損失を付けるか。系列は説明用に簡略化した例</text>
